name: ASP.NET Core CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
        
      - name: Publish
        run: dotnet publish MvcActionsDemo.Web/MvcActionsDemo.Web.csproj --configuration Release --no-restore --output ./publish
        
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvc-publish
          path: ./publish

      - name: Build Docker image
        run: docker build -t mvc-actions-demo:ci .
  push-docker-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name mvcactionsdemodev

      - name: Build Docker image for ACR
        run: docker build -t mvcactionsdemodev.azurecr.io/mvc-actions-demo:dev .

      - name: Push Docker image to ACR
        run: docker push mvcactionsdemodev.azurecr.io/mvc-actions-demo:dev
